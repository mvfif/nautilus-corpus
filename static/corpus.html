<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nautilus Corpus</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<nav class="navbar">
    <div class="logo">Nautilus Corpus</div>

    <div class="nav-links">
        <a href="/">Главная</a>
        <a href="/corpus" class="active">Корпус</a>
        <a href="/clouds">Облака слов</a>
        <a href="/article">Статья</a>

    </div>
</nav>

<div class="page">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h2>Поиск</h2>

        <div class="search-box">

            <input type="text" id="searchInput" placeholder="Введите слово...">

            <div class="radio-group">
                <label>
                    <strong>Лемма</strong>
                    <input type="radio" name="searchMode" value="lemma" checked>
                </label>

                <label>
                    <input type="radio" name="searchMode" value="word">
                    <strong>Словоформа</strong>
                </label>
            </div>

            <button onclick="searchCorpus()">Найти</button>

        </div>

        <h2>Фильтры</h2>

        <div class="filters">

            <div class="filter-group">
                <h3 class="filter-title">Часть речи</h3>
                <div class="filter-content">
                    <div id="pos"></div>
                </div>
            </div>

            <div class="filter-group">
                <h3 class="filter-title">Падеж</h3>
                <div class="filter-content">
                    <div id="case"></div>
                </div>
            </div>

            <div class="filter-group">
                <h3 class="filter-title">Число</h3>
                <div class="filter-content">
                    <div id="number"></div>
                </div>
            </div>

            <div class="filter-group">
                <h3 class="filter-title">Род</h3>
                <div class="filter-content">
                    <div id="gender"></div>
                </div>
            </div>

            <div class="filter-group">
                <h3 class="filter-title">Время</h3>
                <div class="filter-content">
                    <div id="tense"></div>
                </div>
            </div>

            <div class="filter-group">
                <h3 class="filter-title">Вид</h3>
                <div class="filter-content">
                    <div id="aspect"></div>
                </div>
            </div>

            <div class="filter-group">
                <h3 class="filter-title">Лицо</h3>
                <div class="filter-content">
                    <div id="person"></div>
                </div>
            </div>

            <div class="filter-group">
                <h3 class="filter-title">Наклонение</h3>
                <div class="filter-content">
                    <div id="mood"></div>
                </div>
            </div>

            <div class="filter-group">
                <h3 class="filter-title">Залог</h3>
                <div class="filter-content">
                    <div id="voice"></div>
                </div>
            </div>

            <div class="filter-group">
                <h3 class="filter-title">Одушевленность</h3>
                <div class="filter-content">
                    <div id="animacy"></div>
                </div>
            </div>

            <div class="filter-group">
                <h3 class="filter-title">Песня</h3>
                <div class="filter-content">
                    <div id="song"></div>
                </div>
            </div>

            <div class="filter-group">
                <h3 class="filter-title">Альбом</h3>
                <div class="filter-content">
                    <div id="album"></div>
                </div>
            </div>

            <div class="filter-group">
                <h3 class="filter-title">Автор</h3>
                <div class="filter-content">
                    <div id="author"></div>
                </div>
            </div>

            <div class="filter-group">
                <h3 class="filter-title">Год</h3>
                <div class="filter-content">
                    <div id="year"></div>
                </div>
            </div>
        </div>

    </aside>

    <!-- RESULTS -->

    <main class="results-section">

        <div class="results-header">

            <h1>Корпус текстов</h1>

            <div id="resultsCount"></div>

        </div>

        <div id="results"></div>

    </main>

</div>

<script src="/static/corpus.js"></script>

</body>
</html>
