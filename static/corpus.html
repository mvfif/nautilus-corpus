<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nautilus Corpus</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<nav class="navbar">
    <a href="/" class="logo">
    NAUTILUS CORPUS
    </a>

    <div class="nav-links">
        <a href="/">Главная</a>
        <a href="/corpus" class="active">Корпус</a>
        <a href="/clouds">Облака слов</a>
        <a href="/article">Статья</a>

    </div>
</nav>

<div class="corpus-container">

    <div class="search-panel">

        <h1>Корпус текстов</h1>

        <input
            type="text"
            id="searchInput"
            placeholder="Введите слово..."
        >

        <div class="radio-group">

            <label>
                <input
                    type="radio"
                    name="searchMode"
                    value="lemma"
                    checked
                >
                Лемма
            </label>

            <label>
                <input
                    type="radio"
                    name="searchMode"
                    value="word"
                >
                Словоформа
            </label>

        </div>

        <!-- ГРАММАТИКА -->

        <div class="filter-group">

            <h3 class="filter-title">
                Грамматические признаки
            </h3>

            <div class="filter-content">

                <div class="filter-section">
                    <h4>Часть речи</h4>
                    <div id="pos"></div>
                </div>

                <div class="filter-section">
                    <h4>Падеж</h4>
                    <div id="case"></div>
                </div>

                <div class="filter-section">
                    <h4>Число</h4>
                    <div id="number"></div>
                </div>

                <div class="filter-section">
                    <h4>Род</h4>
                    <div id="gender"></div>
                </div>

                <div class="filter-section">
                    <h4>Время</h4>
                    <div id="tense"></div>
                </div>

                <div class="filter-section">
                    <h4>Вид</h4>
                    <div id="aspect"></div>
                </div>

                <div class="filter-section">
                    <h4>Лицо</h4>
                    <div id="person"></div>
                </div>

                <div class="filter-section">
                    <h4>Наклонение</h4>
                    <div id="mood"></div>
                </div>

                <div class="filter-section">
                    <h4>Залог</h4>
                    <div id="voice"></div>
                </div>

                <div class="filter-section">
                    <h4>Одушевлённость</h4>
                    <div id="animacy"></div>
                </div>

            </div>

        </div>
        <p> </p>

        <!-- МЕТАДАННЫЕ -->

        <div class="filter-group">

            <h3 class="filter-title">
                Метаданные
            </h3>

            <div class="filter-content">

                <div class="filter-section">
                    <h4>Песня</h4>
                    <div id="song"></div>
                </div>

                <div class="filter-section">
                    <h4>Альбом</h4>
                    <div id="album"></div>
                </div>

                <div class="filter-section">
                    <h4>Автор</h4>
                    <div id="author"></div>
                </div>

                <div class="filter-section">

                    <h4>Год</h4>

                    <div class="year-range">

                        <div class="year-display">
                            <span id="yearMinLabel">1983</span>
                            —
                            <span id="yearMaxLabel">1997</span>
                        </div>

                        <div class="slider-container">

                            <div class="slider-track"></div>

                            <div id="sliderRange" class="slider-range"></div>

                            <input
                                type="range"
                                id="yearMin"
                                min="1983"
                                max="1997"
                                value="1983"
                            >

                            <input
                                type="range"
                                id="yearMax"
                                min="1983"
                                max="1997"
                                value="1997"
                            >

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="button-group">

            <button
                class="search-button"
                onclick="searchCorpus()"
            >
                Найти
            </button>

            <button
                class="reset-button"
                onclick="resetFilters()"
            >
                Сбросить
            </button>

        </div>
    </div>

    <div class="results-section">

        <div class="results-header">

            <div id="resultsCount"></div>

        </div>

        <div id="results"></div>

    </div>

</div>


<script src="/static/corpus.js"></script>

</body>
</html>
